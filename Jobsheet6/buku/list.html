<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>SIMPUS-Mini | Daftar Buku</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <header>
        <h1>SIMPUS-Mini</h1>
        <!-- Tombol Hamburger -->
        <button type="button" id="nav-toggle-btn" class="nav-toggle-label" aria-label="Menu">&#9776;</button>
        <nav>
            <ul>
                <li><a href="../index.html">Beranda</a></li>
                <li><a href="list.html">Daftar Buku</a></li>
                <li><a href="tambah.html">Tambah Buku</a></li>
                <li><a href="../anggota/list.html">Daftar Anggota</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section>
            <h2>Daftar Buku</h2>
            
            <!-- Kotak Pencarian Real-Time -->
            <div style="margin-bottom: 15px;">
                <label for="search-input">Cari Buku: </label>
                <input type="text" id="search-input" placeholder="Ketik kata kunci...">
            </div>

            <!-- Loading Indicator (Disembunyikan secara default) -->
            <p id="loading-indicator" style="display:none;">Memuat data...</p>

            <table border="1">
                <thead>
                    <tr>
                        <th>Judul</th>
                        <th>Penulis</th>
                        <th>Tahun</th>
                        <th>Stok</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="tabel-buku">
                    <!-- Baris data akan dirender secara dinamis oleh JavaScript -->
                </tbody>
            </table>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 SIMPUS-Mini &mdash; Jobsheet 6</p>
    </footer>
    <script src="../assets/js/app.js"></script>
    <!-- Script khusus untuk fetch & render data buku -->
    <script src="../assets/js/buku.js"></script>
</body>
</html>
