<html>
    <head>
        <title>Membuat tabel</title>
    </head>
    <body>
        <table border="1" width="40%" height="100%" cellpadding="20" cellspacing="5">
            <tr>
                <td align="right" valign="bottom">
                    <font face="courier">
                        <td rowspan="2">
                            ini baris pertama kolom pertama
                        </td>
                    </font>
                </td>
                <td>
                    ini baris pertama kolom kedua
                </td>
            </tr>
            <tr>
                <td colspan="2">
                    ini sekarang gabungan 2 kolom
                </td>
            </tr>
        </table>
    </body>
</html>
